<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="description" content="한국 스타일 피트니스 트래커 - Korean Fitness Tracker">
    <title>건강친구 | Korean Fitness Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">🌸 건강친구</h1>
                <p class="subtitle">당신의 건강한 친구</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Daily Summary Card -->
            <section class="card daily-summary">
                <h2>오늘의 활동</h2>
                <div class="summary-grid">
                    <div class="stat-item">
                        <div class="stat-icon">👟</div>
                        <div class="stat-value" id="steps">0</div>
                        <div class="stat-label">걸음 수</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">🔥</div>
                        <div class="stat-value" id="calories">0</div>
                        <div class="stat-label">칼로리</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">⏱️</div>
                        <div class="stat-value" id="minutes">0</div>
                        <div class="stat-label">활동 시간</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">💧</div>
                        <div class="stat-value" id="water">0</div>
                        <div class="stat-label">물 (ml)</div>
                    </div>
                </div>
            </section>

            <!-- Progress Circle -->
            <section class="card progress-section">
                <h2>목표 달성률</h2>
                <div class="progress-container">
                    <div class="circular-progress">
                        <svg viewBox="0 0 100 100">
                            <circle class="progress-bg" cx="50" cy="50" r="45"></circle>
                            <circle class="progress-bar" cx="50" cy="50" r="45" id="progressCircle"></circle>
                        </svg>
                        <div class="progress-text">
                            <span id="progressPercent">0</span>%
                        </div>
                    </div>
                    <p class="progress-label">일일 목표</p>
                </div>
            </section>

            <!-- Quick Actions -->
            <section class="card actions-section">
                <h2>빠른 기록</h2>
                <div class="action-buttons">
                    <button class="action-btn" onclick="addSteps(100)">
                        <span class="btn-icon">👟</span>
                        <span>걸음 추가</span>
                    </button>
                    <button class="action-btn" onclick="addCalories(50)">
                        <span class="btn-icon">🔥</span>
                        <span>칼로리 추가</span>
                    </button>
                    <button class="action-btn" onclick="addWater(250)">
                        <span class="btn-icon">💧</span>
                        <span>물 마시기</span>
                    </button>
                    <button class="action-btn" onclick="addMinutes(10)">
                        <span class="btn-icon">⏱️</span>
                        <span>운동 추가</span>
                    </button>
                </div>
            </section>

            <!-- Weekly Chart -->
            <section class="card weekly-section">
                <h2>주간 활동</h2>
                <div class="weekly-chart" id="weeklyChart">
                    <!-- Chart will be generated by JavaScript -->
                </div>
            </section>

            <!-- Motivational Quote -->
            <section class="card quote-section">
                <div class="quote-content">
                    <p class="quote" id="dailyQuote">"건강은 가장 큰 선물입니다."</p>
                    <p class="quote-author">- 한국 속담</p>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">홈</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">통계</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">목표</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">설정</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('Service Worker registered:', registration);
                })
                .catch(error => {
                    console.error('Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
