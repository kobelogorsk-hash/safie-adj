<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E8E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Flower petals (Korean cherry blossom style) -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- Petal 1 -->
    <ellipse cx="256" cy="180" rx="30" ry="50" transform="rotate(0 256 180)"/>
    <!-- Petal 2 -->
    <ellipse cx="256" cy="180" rx="30" ry="50" transform="rotate(72 256 180)"/>
    <!-- Petal 3 -->
    <ellipse cx="256" cy="180" rx="30" ry="50" transform="rotate(144 256 180)"/>
    <!-- Petal 4 -->
    <ellipse cx="256" cy="180" rx="30" ry="50" transform="rotate(216 256 180)"/>
    <!-- Petal 5 -->
    <ellipse cx="256" cy="180" rx="30" ry="50" transform="rotate(288 256 180)"/>
  </g>
  
  <!-- Flower center -->
  <circle cx="256" cy="180" r="20" fill="#FFE66D"/>
  
  <!-- Running person icon (simplified) -->
  <g transform="translate(256, 320)" fill="#FFFFFF">
    <!-- Head -->
    <circle cx="0" cy="-60" r="20"/>
    <!-- Body -->
    <line x1="0" y1="-40" x2="0" y2="20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="-25" y1="-20" x2="25" y2="-10" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="-10" x2="-15" y2="30" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="0" y1="20" x2="-20" y2="60" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="25" y2="55" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Small decorative flowers -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="150" cy="120" r="8"/>
    <circle cx="380" cy="140" r="6"/>
    <circle cx="120" cy="350" r="7"/>
    <circle cx="400" cy="380" r="5"/>
  </g>
</svg>